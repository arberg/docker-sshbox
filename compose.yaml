name: sshbox

services:
  sshbox:
    build:
      context: .
      args:
        USERNAME: ${SSHBOX_USERNAME:-sshbox}
        UID: ${SSHBOX_UID:-1000}
        GID: ${SSHBOX_GID:-100}
    container_name: sshbox
    hostname: sshbox
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${SSHBOX_PORT:-7723}:22"
    volumes:
      - ${SSHBOX_HOME_DIR:-/mnt/user/home/sshbox}:/home/${SSHBOX_USERNAME:-sshbox}
      - ${GIT_REPO_DIR:-/mnt/user/gitsshbox}:/git
      - ${SSHBOX_HOSTKEYS_DIR:-/mnt/user/docker/sshbox/hostkeys}:/etc/ssh/hostkeys
    networks:
      - isolated
    labels:
      net.unraid.docker.icon: https://git-scm.com/images/logos/downloads/Git-Icon-1788C.png
      net.unraid.docker.shell: /bin/bash

networks:
  isolated:
    name: ${NETWORK_ISOLATED_NAME:-sshbox_isolated}
    driver: bridge
    ipam:
      config:
        - subnet: ${NETWORK_ISOLATED_SUBNET:-172.16.0.0/24}
